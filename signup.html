<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DeskShop Landing Page</title>
        <link rel="stylesheet" href="signup.css" />
        <!-- <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&family=Montserrat:wght@600;700&family=Mynerve&display=swap"
        /> -->
    </head>
    <body>
        <div class="main-container">
                <header class="header">
                        <div class="header-content">
                                <h1 class="logo">DeskShop</h1>
                                <nav class="nav-menu">
                                        <a href="index.html" class="nav-item">Home</a>
                                        <div class="products-dropdown">
                                                <button class="products-dropdown-button">Products</button>
                                                <div class="products-dropdown-content">
                                                        <a href="#product1">Test Product 1</a>
                                                        <a href="#product2">Test Product 2</a>
                                                        <a href="#product3">Test Product 3</a>
                                                </div>
                                        </div>
                                        <a href="#" class="nav-item">About Us</a>
                                        <a href="faq.html" class="nav-item">FAQ</a>                                        <a href="#" class="nav-item">Contact us</a>
                                        <img
                                        src="Assets/icons/add-to-cart.svg"
                                        alt="Cart"
                                        class="cart-icon"
                                        />
                                </nav>
                                <button class="signup-btn" onclick="window.location.href='signup.html'">Sign up</button>
                        </div>
                </header>

            <main class="content-wrapper">
                <section class="right-section">
                    <form class="signup-form">
                        <h2 class="form-title">Get Started Now</h2>
                        <div class="form-group">
                            <label class="label" for="name">Name</label>
                            <input
                                type="text"
                                id="name"
                                placeholder="Enter your name"
                                class="input-field"
                            />
                        </div>
                        <div class="form-group">
                            <label class="label" for="email">Email address</label>
                            <input
                                type="email"
                                id="email"
                                placeholder="Enter your email"
                                class="input-field"
                            />
                        </div>
                        <div class="form-group">
                            <label class="label" for="password">Password</label>
                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                class="input-field"/>
                                <img src="Assets/icons/eye-off.svg" alt="Show/Hide Password" class="eye-icon" id="togglePassword" />
                        </div>
                        <div class="terms-checkbox">
                            <input type="checkbox" id="terms" class="input" />
                            <label for="terms">
                                <span>I agree to the</span>
                                <span class="underline">terms & policy</span>
                            </label>
                        </div>
                        <button type="submit" class="signup-submit">Signup</button>
                        <div class="login-link">
                            <span>Have an account?</span>
                            <a href="signin.html" class="sign-in">Sign In</a>
                        </div>
                    </form>
                </section>
            </main>
        </div>

        <div class="footer-container">
            <footer class="footer" style="background: linear-gradient(0deg, rgba(115, 115, 115, 0.53) 0%, rgba(242, 242, 242, 0.45) 100%);">
                <div class="footer-content">
                        <div class="footer-row">
                                <div class="footer-column">
                                        <div class="footer-logo-wrapper">
                                                <img loading="lazy" src="Assets/DeskShop Logo.png" class="footer-logo" alt="DeskShop logo" />
                                                <img loading="lazy" src="Assets/icons/social-media-icons.svg" class="footer-social" alt="Social media icons" />
                                                <p class="footer-copyright">©2025 Matheesha Pathirana</p>
                                        </div>
                                </div>
                                <div class="footer-columns-wrapper">
                                        <div class="footer-links-column">
                                                <div class="footer-links">
                                                        <h3 class="footer-links-title">Information</h3>
                                                        <nav class="footer-link-list">
                                                                <a href="index.html">Main</a><br />
                                                                <a href="#">Products</a><br />
                                                                <a href="#">About us</a><br />
                                                                <a href="#">Contact us</a>
                                                        </nav>
                                                </div>
                                        </div>
                                        <div class="footer-contact-column">
                                                <div class="footer-contact">
                                                        <h3 class="footer-contact-title">Contact</h3>
                                                        <p class="footer-contact-phone">
                                                                <strong>Phone:</strong><br />
                                                                (123)456-7890
                                                        </p>
                                                        <p class="footer-contact-email">
                                                                <strong>Email:</strong><br />
                                                                pathiranamatheesha@gmail.com
                                                        </p>
                                                </div>
                                        </div>
                                </div>
                        </div>
                </div>
            </footer>
        </div>
        <script>
            document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordField = document.getElementById('password');
            const eyeIcon = document.getElementById('togglePassword');
            
            if (passwordField.type === 'password') {
                    passwordField.type = 'text';
                    eyeIcon.src = 'Assets/icons/eye-on.svg';
            } else {
                    passwordField.type = 'password';
                    eyeIcon.src = 'Assets/icons/eye-off.svg';
            }
            });
    </script>
    </body>
</html>
