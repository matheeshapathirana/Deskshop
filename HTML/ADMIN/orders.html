<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Orders</title>
  <link rel="stylesheet" href="orders.css">
</head>
<body>
  <div class="admin-panel">
    <aside class="sidebar">
      <h2>Deskshop Admin Panel</h2>
      <ul>
        <li><a href="admin.html">Products</a></li>
        <li><a href="#" class="active">Orders</a></li>
        <li><a href="#">Logout</a></li>
      </ul>
    </aside>
    <main class="main-content">
      <h1>Orders</h1>
      <table>
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Total</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1001</td>
            <td>John Doe</td>
            <td>$120.00</td>
            <td>Processing</td>
            <td class="action-buttons">
              <button class="edit-button" title="Edit">Edit</button>
              <button class="delete-button" title="Delete">Delete</button>
              <button class="button" title="View">View</button>
              <button class="button" title="Mark as Shipped">Mark as Shipped</button>
              <button class="button" title="Print">Print</button>
            </td>
          </tr>
          <tr>
            <td>1002</td>
            <td>Jane Smith</td>
            <td>$250.00</td>
            <td>Shipped</td>
            <td class="action-buttons">
              <button class="edit-button" title="Edit">Edit</button>
              <button class="delete-button" title="Delete">Delete</button>
              <button class="button" title="View">View</button>
              <button class="button" title="Mark as Shipped">Mark as Shipped</button>
              <button class="button" title="Print">Print</button>
            </td>
          </tr>
        </tbody>
      </table>
    </main>
  </div>
</body>
</html>
