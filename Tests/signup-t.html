                xml:space="preserve"
                style="white-space: pre"
                font-family="Montserrat"
                font-size="18"
                font-weight="bold"
                letter-spacing="0em"
              >
                <tspan x="28.8115" y="18.6">Products</tspan>
              </text>
            </svg>
          </div>
          <a href="#" class="nav-item">Delivery</a>
          <a href="#" class="nav-item">About us</a>
          <a href="#" class="nav-item">Contact us</a>
        </nav>
        <button class="signup-btn">Sign up</button>
      </header>

      <main class="content-wrapper">
        <section class="left-section">
          <img
            src="..................."
            alt="Desk setup"
            class="main-image"
          />
        </section>
        <section class="right-section">
          <form class="signup-form">
            <h2 class="form-title">Get Started Now</h2>
            <div class="form-group">
              <label class="label" for="name">Name</label>
              <input
                type="text"
                id="name"
                placeholder="Enter your name"
                class="input-field"
              />
            </div>
            <div class="form-group">
              <label class="label" for="email">Email address</label>
              <input
                type="email"
                id="email"
                placeholder="Enter your email"
                class="input-field"
              />
            </div>
            <div class="form-group">
              <label class="label" for="password">Password</label>
              <input
                type="password"
                id="password"
                placeholder="Name"
                class="input-field"
              />
            </div>
            <div class="terms-checkbox">
              <input type="checkbox" id="terms" class="input" />
              <label for="terms">
                <span>I agree to the</span>
                <span class="underline">terms & policy</span>
              </label>
            </div>
            <button type="submit" class="signup-submit">Signup</button>
            <div class="login-link">
              <span>Have an account?</span>
              <a href="#" class="sign-in">Sign In</a>
            </div>
          </form>
        </section>
      </main>

      <footer class="footer">
        <div class="footer-content">
          <div class="footer-logo">
            <img
              src="..................."
              alt="Logo"
              class="footer-logo-img"
            />
          </div>
          <div class="footer-links">
            <section class="footer-section">
              <h3 class="footer-title">Information</h3>
              <nav class="footer-menu">
                <a href="#">Main</a>
                <a href="#">Products</a>
                <a href="#">About us</a>
                <a href="#">Contact us</a>
              </nav>
            </section>
            <section class="footer-section">
              <h3 class="footer-title">Contact</h3>
              <div class="contact-info">
                <div class="contact-item">
                  <span class="bold">Phone:</span>
                  <br />
                  <span>(123)456-7890</span>
                </div>
                <div class="contact-item">
                  <span class="bold">Email:</span>
                  <br />
                  <span>pathiranamatheesha@gmail.com</span>
                </div>
              </div>
            </section>
