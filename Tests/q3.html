<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Image Grid</title>
  <link rel="stylesheet" href="q3.css">
</head>
<body>
  <div class="grid-container">
    <div class="grid-item small-width">
      <img src="image1.jpg" alt="Writing Tools">
      <div class="overlay">
        <h3>Writing Tools</h3>
      </div>
    </div>
    <div class="grid-item large-width">
      <img src="image2.jpg" alt="Desk Accessories">
      <div class="overlay">
        <h3>Desk Accessories</h3>
      </div>
    </div>
    <div class="grid-item large-width">
      <img src="image3.jpg" alt="Office Essentials">
      <div class="overlay">
        <h3>Office Essentials</h3>
      </div>
    </div>
    <div class="grid-item small-width">
      <img src="image4.jpg" alt="Art Supplies">
      <div class="overlay">
        <h3>Art Supplies</h3>
      </div>
    </div>
  </div>
</body>
</html>
