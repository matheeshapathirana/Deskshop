<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - DeskShop</title>
    <link rel="stylesheet" href="contact-us-t.css" />
  </head>
  <body>
    <div class="page-container">
      <header class="header">
        <div class="header-content">
          <h1 class="logo">DeskShop</h1>
          <nav class="nav-menu">
            <a href="#" class="nav-item">Home</a>
            <a href="#" class="nav-item-products">Products</a>
            <a href="#" class="nav-item">Delivery</a>
            <a href="#" class="nav-item">About us</a>
            <a href="#" class="nav-item">Contact us</a>
          </nav>
          <button class="signup-btn">Sign up</button>
        </div>
      </header>

      <main>
        <h2 class="page-title">Contact Us</h2>

        <section class="contact-form-container">
          <form class="contact-form">
            <input
              type="text"
              placeholder="Full Name"
              class="form-input name-input"
            />
            <input
              type="email"
              placeholder="Email Address"
              class="form-input email-input"
            />
            <input
              type="tel"
              placeholder="Phone Number"
              class="form-input phone-input"
            />
            <textarea
              placeholder="Message"
              class="form-input message-input"
            ></textarea>
            <button type="submit" class="submit-btn">Submit</button>
          </form>
        </section>
      </main>

      <footer class="footer-container">
        <div class="footer-content">
          <div class="footer-columns">
            <div class="footer-column-brand">
              <div class="brand-content">
                <img
                  src="https://cdn.builder.io/api/v1/image/assets/2430957f6a9342adb406d80ebc430d91/e7a3dcd8418796378538e7c8e14ec1e12480aec581ea875a7881e77ca194d1ef?placeholderIfAbsent=true"
                  alt="DeskShop Logo"
                  class="brand-logo"
                />
                <img
                  src="https://cdn.builder.io/api/v1/image/assets/2430957f6a9342adb406d80ebc430d91/fe40eefead1a7c579d99cbba9594e67f0acdec8aa0b7e86a30aa672b4f153068?placeholderIfAbsent=true"
                  alt="Social Media Icons"
                  class="social-icons"
                />
                <p class="copyright">©2025 Matheesha Pathirana</p>
              </div>
            </div>

            <div class="footer-column-info">
              <div class="info-content">
                <h3 class="column-title">Information</h3>
                <p class="info-links">
                  Main<br />
                  Products<br />
                  About us<br />
                  Contact us
                </p>
              </div>
            </div>

            <div class="footer-column-contact">
              <div class="contact-content">
                <h3 class="column-title">Contact</h3>
                <p class="contact-phone">
                  <span style="font-weight: 600">Phone:</span><br />
                  (123)456-7890
                </p>
                <p class="contact-email">
                  <span style="font-weight: 600">Email:</span><br />
                  pathiranamatheesha@gmail.com
                </p>
              </div>
            </div>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
